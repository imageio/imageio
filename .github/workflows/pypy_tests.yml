name: PyPy Test Suite

on:
  workflow_call:

jobs:
  pypy:
    name: "${{ matrix.os }} / pypy-3.11"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up pypy
        uses: actions/setup-python@v5
        with:
          # PyPy 8.0 (3.11.16) uses the pp80 ABI. Pillow 12.3.0 only publishes
          # pp73 wheels, so stay on the last PyPy 7.3 release until Pillow 13.
          python-version: "pypy-3.11-v7.3.23"
      - name: MacOS Numpy Fix
        if: runner.os == 'macOS'
        run: |
            brew install openblas
            OPENBLAS="$(brew --prefix openblas)" pypy3 -m pip install numpy
      - name: Install dependencies
        shell: bash
        run: |
            pypy3 -m pip install .[test,all-plugins-pypy]
      - name: Run Unit tests
        run: |
            pytest -v --github-username "anything" --github-token ${{ secrets.GITHUB_TOKEN }}
