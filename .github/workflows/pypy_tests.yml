name: PyPy Test Suite

on:
  workflow_call:

jobs:
  pypy:
    name: "${{ matrix.os }} / pypy-3.11"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up pypy
        uses: actions/setup-python@v5
        with:
          # Unpinned pypy-3.11 resolves to PyPy 8.0 on macOS. PyPy 8's wheel
          # ABI is pp80, and pillow-heif only publishes pp73 wheels, so pip
          # builds from source and fails without libheif.
          python-version: "pypy3.11-v7.3.23"
      - name: MacOS Numpy Fix
        if: runner.os == 'macOS'
        run: |
            brew install openblas
            OPENBLAS="$(brew --prefix openblas)" pypy3 -m pip install numpy
      - name: Install dependencies
        shell: bash
        run: |
            pypy3 -m pip install .[test,all-plugins-pypy]
      - name: Run Unit tests
        run: |
            pytest -v --github-username "anything" --github-token ${{ secrets.GITHUB_TOKEN }}
